<!-- Soliyog header mark — the no-square lockup mark used on dark brand canvases.
     Figure (head + rising zigzag body) + upward arrow in the indigo->teal gradient,
     seated on an amber L-bracket (chart axes). Reconstructed from soliyog.com header + icon.svg. -->
<svg width="34" height="32" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soliyog">
  <defs>
    <linearGradient id="soliyog-hdr" x1="3" y1="28" x2="29" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- amber L-bracket: one rounded corner, bottom rail + right rail -->
  <path d="M5 28 H24 V12" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="8.6" cy="7.6" r="3.1" fill="#6366F1"/>
  <!-- rising zigzag body -->
  <path d="M4 23.5 L11 12.5 L16 17.5 L25 6.5" fill="none" stroke="url(#soliyog-hdr)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead -->
  <path d="M27.5 4 L19 5.4 L25.6 12.6 Z" fill="url(#soliyog-hdr)"/>
</svg>
