<!-- Soliyog horizontal lockup — header mark + wordmark. EXACT copy of the live
     soliyog.com header logo (verified 2026-08-30), plus the "Soliyog" wordmark.
     Outline the text before external handoff if the renderer lacks Space Grotesk. -->
<svg width="216" height="34" viewBox="0 0 216 34" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soliyog">
  <defs>
    <linearGradient id="soliyog-lk" x1="4" y1="27" x2="27" y2="5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,1)">
    <path d="M12.5 27 H27 V12.5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 24.5 L13 15.5 L18 20.5 L24.7 10.3" fill="none" stroke="url(#soliyog-lk)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 5.6 L20.2 6 L25.7 13.6 Z" fill="url(#soliyog-lk)" stroke="url(#soliyog-lk)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="11.6" cy="8.4" r="3.4" fill="url(#soliyog-lk)"/>
  </g>
  <text x="42" y="25" font-family="'Space Grotesk','Inter',sans-serif" font-size="24" font-weight="500" letter-spacing="-0.7" fill="#F8FAFC">Soliyog</text>
</svg>
