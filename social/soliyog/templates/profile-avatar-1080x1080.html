<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { width: 1080px; height: 1080px; }
  .canvas { width: 1080px; height: 1080px; padding: 0; align-items: center; justify-content: center; background: #151527; }
  /* exact current soliyog.com header mark, optically centred + circle-crop safe for IG */
  .avatar { width: 720px; height: 720px; display: block; }
</style>
</head>
<body>
  <div class="canvas poster">
    <svg class="avatar" viewBox="1.7 2.75 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soliyog">
      <defs>
        <linearGradient id="soliyog-mark" x1="4" y1="27" x2="27" y2="5" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6366f1"/>
          <stop offset="1" stop-color="#2dd4bf"/>
        </linearGradient>
      </defs>
      <path d="M12.5 27 H27 V12.5" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 24.5 L13 15.5 L18 20.5 L24.7 10.3" fill="none" stroke="url(#soliyog-mark)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 5.6 L20.2 6 L25.7 13.6 Z" fill="url(#soliyog-mark)" stroke="url(#soliyog-mark)" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="11.6" cy="8.4" r="3.4" fill="url(#soliyog-mark)"/>
    </svg>
  </div>
</body>
</html>
