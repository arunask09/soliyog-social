<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1.0">
<link rel="stylesheet" href="_tokens.css">
<style>
  html, body { width: 1080px; height: 1350px; }
  .canvas { width: 1080px; height: 1350px; }
  .headline { font-size: 78px; }
  .kicker { font-size: 28px; color: var(--text-muted); margin-top: 28px; line-height: 1.45; max-width: 80%; }
  .swipe { display: flex; align-items: center; gap: 14px; font-size: 24px; color: var(--text-dim); font-weight: 600; }
  .swipe .arrow { color: var(--teal); font-size: 30px; }
</style>
</head>
<body>
  <div class="canvas card-canvas">
    <div class="topbar"></div>
    <div class="glow"></div>

    <span class="chip">Role decoded</span>

    <div class="spacer"></div>

    <!-- EDIT: cover headline -->
    <h1 class="headline">What a <span class="accent">Data Analyst</span> actually does all week</h1>
    <!-- EDIT: one-line promise of the carousel -->
    <p class="kicker">Not dashboards all day. Here's the real breakdown, and what interviewers actually test for.</p>

    <div class="spacer"></div>

    <div class="footer">
      <div class="brand">
        <svg class="mark" viewBox="0 0 34 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Soliyog"><defs><linearGradient id="fm" x1="3" y1="28" x2="29" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient></defs><path d="M5 28 H24 V12" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="7.6" r="3.1" fill="#6366F1"/><path d="M4 23.5 L11 12.5 L16 17.5 L25 6.5" fill="none" stroke="url(#fm)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M27.5 4 L19 5.4 L25.6 12.6 Z" fill="url(#fm)"/></svg>
        <span class="name">Soliyog</span>
      </div>
      <span class="swipe">Swipe <span class="arrow">&rarr;</span></span>
    </div>
  </div>
</body>
</html>
