name: daily-post
on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST — best-effort native trigger; precision-trigger.yml is the reliable path
  workflow_dispatch:
    inputs:
      slug:
        description: post a specific queue slug (optional)
        required: false

concurrency: soliyog-post

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: social/soliyog/automation/package-lock.json
      - name: install deps
        working-directory: social/soliyog/automation
        run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: post
        working-directory: social/soliyog/automation
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ secrets.GH_REPO }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_LINKEDIN_CHANNEL_ID: ${{ secrets.BUFFER_LINKEDIN_CHANNEL_ID }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node post.mjs ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}
      - name: close the review issue for whatever was just posted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=$(git log -1 --format=%s | sed -n 's/^post: \(.*\) -> posted$/\1/p')
          [ -n "$posted" ] || { echo "nothing posted this run"; exit 0; }
          for n in $(gh issue list --label pending-review --state open --json number -q '.[].number'); do
            slug=$(gh issue view "$n" --json body -q .body \
              | sed -n 's/.*soliyog-review slug=\([a-z0-9-]*\).*/\1/p' | head -1)
            if [ "$slug" = "$posted" ]; then
              gh issue comment "$n" --body "Posted ✅"
              gh issue close "$n"
            fi
          done

      - name: scaffold the next draft from the listings
        id: next
        if: success()
        working-directory: social/soliyog/automation
        env:
          ISSUE_BODY_FILE: ${{ runner.temp }}/next-issue.md
        run: |
          posted=$(git log -1 --format=%s | sed -n 's/^post: \(.*\) -> posted$/\1/p')
          [ -n "$posted" ] || { echo "nothing posted this run — not scaffolding"; exit 0; }
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node next-post.mjs

      - name: write commentary for the new draft
        id: commentary
        if: steps.next.outputs.created == '1'
        working-directory: social/soliyog/automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node write-commentary.mjs --slug "${{ steps.next.outputs.slug }}"

      - name: open a needs-commentary issue only if commentary could not be written
        if: steps.next.outputs.created == '1' && steps.commentary.outputs.still_draft == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-commentary --color 0E8A16 \
            --description "Soliyog draft awaiting role_tests + soliyog_read" --force
          gh issue create \
            --title "$(cat "${{ steps.next.outputs.title_file }}")" \
            --body-file "${{ steps.next.outputs.body_file }}" \
            --label needs-commentary
