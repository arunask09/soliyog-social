name: daily-post
on:
  schedule:
    - cron: "30 8 * * *"   # TEST: 14:00 IST — temporary, reverting to 09:00 IST once confirmed firing
  workflow_dispatch:
    inputs:
      slug:
        description: post a specific queue slug (optional)
        required: false

concurrency: soliyog-post

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social/soliyog/automation/package-lock.json
      - name: install deps
        working-directory: social/soliyog/automation
        run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: post
        working-directory: social/soliyog/automation
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_REPO: ${{ secrets.GH_REPO }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node post.mjs ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}
      - name: close the review issue for whatever was just posted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          posted=$(git log -1 --format=%s | sed -n 's/^post: \(.*\) -> posted$/\1/p')
          [ -n "$posted" ] || { echo "nothing posted this run"; exit 0; }
          for n in $(gh issue list --label pending-review --state open --json number -q '.[].number'); do
            slug=$(gh issue view "$n" --json body -q .body \
              | sed -n 's/.*soliyog-review slug=\([a-z0-9-]*\).*/\1/p' | head -1)
            if [ "$slug" = "$posted" ]; then
              gh issue comment "$n" --body "Posted ✅"
              gh issue close "$n"
            fi
          done
