name: prep-post
on:
  schedule:
    - cron: "30 12 * * *"   # 18:00 IST — the evening before the 09:00 IST post
  workflow_dispatch:
    inputs:
      slug:
        description: prep a specific queue slug (optional; skips the date filter)
        required: false

concurrency: soliyog-post

jobs:
  prep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social/soliyog/automation/package-lock.json
      - name: install deps
        working-directory: social/soliyog/automation
        run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: prep
        id: prep
        working-directory: social/soliyog/automation
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ISSUE_BODY_FILE: ${{ runner.temp }}/issue-body.md
        run: |
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node prep-post.mjs ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}
      - name: open review issue
        if: steps.prep.outputs.open_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create pending-review --color FBBF24 \
            --description "Soliyog post awaiting phone review" --force
          gh issue create \
            --title "$(cat "${{ steps.prep.outputs.title_file }}")" \
            --body-file "${{ steps.prep.outputs.body_file }}" \
            --label pending-review
