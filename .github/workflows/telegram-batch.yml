name: telegram-batch
on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST — cut from 3x/day to 1x/day to stay under Telegram's ~14/week mute-risk ceiling
  workflow_dispatch:

concurrency: soliyog-telegram-batch

jobs:
  batch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: post batch
        working-directory: social/soliyog/automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          git config user.name  "soliyog-bot"
          git config user.email "bot@users.noreply.github.com"
          node telegram-batch.mjs
